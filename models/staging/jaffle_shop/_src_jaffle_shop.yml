sources:
  - name: jaffle_shop
    description: A clone of the PostgreSQL database
    database: raw
    schema: jaffle_shop
    config:
      freshness:
        warn_after:
          count: 72
          period: hour
        error_after:
          count: 30
          period: day
    tables:
      - name: customers
        description: Raw customers data
        columns:
          - name: id
            description: Customer natural key from database
            data_tests:
              - unique
              - not_null

        # config:
        #   loaded_at_field: _etl_loaded_at
      - name: orders
        description: Raw orders data
        # config:
        #   loaded_at_field: _etl_loaded_at
