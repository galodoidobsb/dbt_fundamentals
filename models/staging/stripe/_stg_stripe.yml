models:

  - name: stg_stripe__payments
    description: One payment per row
    columns:

      - name: id
        description: Primary key for payment transaction

      - name: order_id
        description: Foreign key referencing Jaffle Shop order id 

      - name: payment_method
        description: 'Payment method used for the transaction, can be one of the following: "credit_card", "bank_transfer", "gift_card" or "coupon"'

      - name: status
        description: Status of the transaction, can be either "success" or "fail"

      - name: amount
        description: Payment amount in dollars
